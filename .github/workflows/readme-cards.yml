name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=ssouzawallace&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_1 }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=ssouzawallace&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_1 }}

      - name: Generate blocks pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ssouzawallace&repo=blocks&theme=tokyonight&hide_border=true
          path: profile/pin-blocks.svg
          token: ${{ secrets.PAT_1 }}

      - name: Generate appia pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ssouzawallace&repo=appia-design-system&theme=tokyonight&hide_border=true
          path: profile/pin-appia.svg
          token: ${{ secrets.PAT_1 }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b  # v3.5.0
        with:
          github_user_name: ssouzawallace
          outputs: |
            profile/github-contribution-grid-snake.svg
            profile/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
