name: Update README gen-repo-pins

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: profile-icons/github-profile-repo-pins@v1
        with:
          # A credential, so it stays a secret.
          gh_api_token: ${{ secrets.GH_API_TOKEN || secrets.GITHUB_TOKEN }}

          # Everything below is public configuration and is deliberately inline.
          # Sourcing it from secrets printed every value as "***" in the run log,
          # so the failure on 2026-09-17 could say a value was malformed without
          # showing which one or what it held.
          gh_username: ${{ github.repository_owner }}

          # One comma-separated string, each entry "owner/repo". Spaces, newlines
          # and an empty entry from a trailing comma are all rejected - that is
          # what "must be in a single string and separated by commas" is checking.
          # The list also fixes the pin count, so num_repo_pins and repo_pin_order
          # are left out: the action ignores both once this input is set.
          repo_names_exclusive: "ssouzawallace/blocks,ssouzawallace/Rick-and-Morty-Characters,ssouzawallace/cats,ssouzawallace/senolop,ssouzawallace/appia-design-system"

          # is_exclude_repos_owned, is_exclude_repos_contributed,
          # is_contribution_stats, is_i18n, is_nllb and hf_token are omitted
          # rather than wired to secrets. The action reads any non-empty value as
          # true, so a secret holding the text "false" switches the flag on.
          # Omitted is off, and that is the behaviour this profile wants.

      # The action would also write the pins into README as markdown images, two
      # per row, which can't be sized, so in a narrow window each card stayed
      # 412px wide against the left edge. README has FEATURED-REPOS markers
      # instead of the action's REPO-PINS ones, so the action leaves README
      # alone, and this step rebuilds the block from the images it just
      # published: one full-width card per row below 1280px, the 2x2 grid above.
      # Cards are numbered by position, so when a repo drops out or comes back
      # (senolop dropped out on 2026-09-24, when it stopped being public) the
      # rebuild keeps every card linked to its own repo.
      - name: Rebuild Featured repos block
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --quiet origin +refs/heads/generated:refs/remotes/origin/generated
          python3 .github/scripts/featured_repos.py
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update featured repos"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            echo "Push failed #$attempt"
            git pull --rebase origin "$DEFAULT_BRANCH"
          done
          exit 1
