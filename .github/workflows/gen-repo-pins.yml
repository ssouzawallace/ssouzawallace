name: Update README gen-repo-pins

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: profile-icons/github-profile-repo-pins@v1
        with:
          # A credential, so it stays a secret.
          gh_api_token: ${{ secrets.GH_API_TOKEN || secrets.GITHUB_TOKEN }}

          # Everything below is public configuration and is deliberately inline.
          # Sourcing it from secrets printed every value as "***" in the run log,
          # so the failure on 2026-09-17 could say a value was malformed without
          # showing which one or what it held.
          gh_username: ${{ github.repository_owner }}

          # One comma-separated string, each entry "owner/repo". Spaces, newlines
          # and an empty entry from a trailing comma are all rejected - that is
          # what "must be in a single string and separated by commas" is checking.
          # The list also fixes the pin count, so num_repo_pins and repo_pin_order
          # are left out: the action ignores both once this input is set.
          repo_names_exclusive: "ssouzawallace/blocks,ssouzawallace/Rick-and-Morty-Characters,ssouzawallace/cats,ssouzawallace/senolop,ssouzawallace/appia-design-system"

          # is_exclude_repos_owned, is_exclude_repos_contributed,
          # is_contribution_stats, is_i18n, is_nllb and hf_token are omitted
          # rather than wired to secrets. The action reads any non-empty value as
          # true, so a secret holding the text "false" switches the flag on.
          # Omitted is off, and that is the behaviour this profile wants.
